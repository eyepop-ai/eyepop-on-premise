name: eyepop-on-premise

volumes:
  eyepop_instance_private:
  eyepop_instance_models:

services:
  volume-permissions:
    image: ${EYEPOP_RUNTIME_IMAGE:-registry.eyepop.ai/ai/runtime-cpu:latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - mkdir -p /opt/eyepop/private /opt/eyepop/models && chown -R eyepop:eyepop /opt/eyepop/private /opt/eyepop/models
    volumes:
      - type: volume
        source: eyepop_instance_private
        target: /opt/eyepop/private
      - type: volume
        source: eyepop_instance_models
        target: /opt/eyepop/models
    restart: "no"

  eyepop-instance:
    image: ${EYEPOP_RUNTIME_IMAGE:-registry.eyepop.ai/ai/runtime-cpu:latest}
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${EYEPOP_HTTP_PORT:-8080}:8080"
    environment:
      EYEPOP_URL: ${EYEPOP_URL:?set EYEPOP_URL in .env}
      EYEPOP_API_KEY: ${EYEPOP_API_KEY:?set EYEPOP_API_KEY in .env}
      EYEPOP_ACCOUNT_UUID: ${EYEPOP_ACCOUNT_UUID:?set EYEPOP_ACCOUNT_UUID in .env}
    volumes:
      - type: volume
        source: eyepop_instance_private
        target: /opt/eyepop/private
      - type: volume
        source: eyepop_instance_models
        target: /opt/eyepop/models
    tmpfs:
      - /tmp:size=8g,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
