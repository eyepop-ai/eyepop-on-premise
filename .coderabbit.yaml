# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repository layer on top of the organization settings. Values set here win; everything else comes
# from the organization. Reviews run only on request: add the `needs-review` label, or comment
# `@coderabbitai review`.
inheritance: true
language: en
chat:
  # Reply only when mentioned, so threads don't trigger CodeRabbit on their own.
  auto_reply: false
  art: false
reviews:
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main
    # One review per request. Later pushes are not re-reviewed until someone asks again.
    auto_incremental_review: false
    labels:
      - needs-review
      - '!skip-review'
      - '!no-review'
      - '!autorelease: pending'
    ignore_title_keywords:
      - '[skip review]'
      - DO NOT MERGE
    ignore_usernames:
      - dependabot[bot]
      - github-actions[bot]
  high_level_summary: true
  poem: false
  # No "Review skipped" comment on every unlabeled PR.
  review_status: false
  profile: chill
  request_changes_workflow: false
  review_details: true
  commit_status: true
