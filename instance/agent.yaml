instance-name: on-premise-agent
http-host: 0.0.0.0
http-port: 8080
model-cache-dir: /opt/eyepop/models
private-config-dir: /opt/eyepop/private
pipeline-exec: /usr/bin/eyepop-pipeline
pipeline-platform-mode: default
public-file-dir: /usr/share/eyepop-ai/public
pipeline-log-passthrough: true
routes:
  debug:
    enabled: false
  swagger:
    enabled: true
  dashboard:
    enabled: true
    path: /dashboard
agent:
  enabled: true
  config-dir: /opt/eyepop/agent.d
  store:
    uri: sqlite:///opt/eyepop/private/agent-history.db
